<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />         <!-- for symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- First creating NavBar (Top), we r divding it into lefthalf and right half -->
     <nav>
        <div class="left-half"> <!--It has a spotify logo, home pg option and a search bar-->
            <div class="logo"><i class="fa-brands fa-spotify"></i></div>
            <div class="home-icon"><i class="fa-solid fa-house"></i></div>
            <div class="search-bar"> <!-- It has 3 elements (search icon, input element, browse icon )-->
                <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                <input type="text" class="input-box" placeholder="What do you want to play?">
                <div class="browse"><i class="fa-solid fa-folder-open"></i></div>
            </div>
        </div>

         <div class="right-half">  <!--It again has 2 parts-->
                <div class="right-half-p1">   <!--It has 3 (paragraph tags) tags: premium, support, download-->
                    <p class="nav-text">Premium</p>
                    <p class="nav-text">Support</p>
                    <p class="nav-text">Download</p>
                </div>
                <div class="right-half-p2">   <!--It has 3 elements: download-icon & install app, sign up, login-->
                    <div class="nav-text"><i class="fa-regular fa-circle-down"></i> Install App</div>
                    <div class="nav-text">Sign up</div>
                    <button class="login-btn"> Login </button>
                </div>
         </div>
     </nav>


    <!--Main section (center) -->
    <!-- It again has left part (side bar) and right part(main music playlists area) -->
    
    <div class="main">

        <!--LEFT PART IN MAIN SECTION --> 
        <div class="main-left-part">

            <div class="library"> 
                <p>Your Library</p>
                <div>+</div>
            </div>

            <div class="box-container">

                <div class="box">
                    <h4>Create your first playlist</h4>
                    <p>It's easy we'll help you</p>
                    <button>Create playlist</button>
                </div>

                <div class="box">
                    <h4>Let's find some podcast to follow</h4>
                    <p>We'll keep you updated on new updates</p>
                    <button>Browse podcasts</button>
                </div>

            </div>

        </div>

        <div class="main-right-part">

        </div>

    </div>
    
     



    <!--Player section (bottom)-->
</body>

</html>
